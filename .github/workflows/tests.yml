name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Build native C++ spatial backend
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 2
      - name: Verify native library load
        env:
          PHOTONX_NATIVE_LIBRARY: ${{ github.workspace }}/build/native/lib/libphotonx_native.so
        run: python -c "from photonx_eda_pcb.spatial_connectivity.native_backend import native_available; assert native_available()"
      - name: Run regression suite with native backend enabled
        env:
          PHOTONX_NATIVE_LIBRARY: ${{ github.workspace }}/build/native/lib/libphotonx_native.so
        run: pytest -q

  native-portability:
    name: native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native-library: build/native/lib/libphotonx_native.so
          - os: macos-latest
            native-library: build/native/lib/libphotonx_native.dylib
          - os: windows-latest
            native-library: build/native/lib/photonx_native.dll
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Build native C++ spatial backend
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 2
      - name: Verify native library load
        env:
          PHOTONX_NATIVE_LIBRARY: ${{ github.workspace }}/${{ matrix.native-library }}
        run: python -c "from photonx_eda_pcb.spatial_connectivity.native_backend import native_available; assert native_available()"
      - name: Run native parity smoke tests
        env:
          PHOTONX_NATIVE_LIBRARY: ${{ github.workspace }}/${{ matrix.native-library }}
        run: pytest -q tests/test_cpp_spatial_backend.py
      - name: Install wheel build frontend
        run: python -m pip install build
      - name: Build wheel with embedded native library
        env:
          PHOTONX_BUILD_NATIVE: "1"
        run: python -m build --wheel
      - name: Verify wheel is platform-specific
        run: python -c "from pathlib import Path; wheels=list(Path('dist').glob('*.whl')); assert len(wheels)==1, wheels; assert 'none-any' not in wheels[0].name, wheels[0].name"
      - name: Install packaged native wheel
        run: python -c "from pathlib import Path; import subprocess,sys; wheel=next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(wheel)])"
      - name: Verify package-local native discovery
        run: python -c "from photonx_eda_pcb.spatial_connectivity import AABB,SpatialHashIndex,candidate_pairs; from photonx_eda_pcb.spatial_connectivity.native_backend import native_available; assert native_available(); i=SpatialHashIndex(1.0); i.insert('a',AABB(0,0,1,1)); i.insert('b',AABB(1,0,2,1)); assert candidate_pairs(i,backend='native') == [('a','b')]"
