name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: pytest -q

  rust-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo test --manifest-path native/Cargo.toml
      - run: python -m pip install --upgrade pip "maturin>=1.14,<2"
      - run: maturin build --manifest-path native/Cargo.toml --features python --interpreter python --out dist/native
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install dist/native/*.whl
      - run: pytest -q tests/test_native_spatial_backend.py tests/test_connectivity_spatial_parity_phase28.py
