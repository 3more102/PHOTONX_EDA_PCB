name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Build native C++ spatial backend
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 2
      - name: Verify native library load
        env:
          PHOTONX_NATIVE_LIBRARY: ${{ github.workspace }}/build/native/lib/libphotonx_native.so
        run: python -c "from photonx_eda_pcb.spatial_connectivity.native_backend import native_available; assert native_available()"
      - name: Run regression suite with native backend enabled
        env:
          PHOTONX_NATIVE_LIBRARY: ${{ github.workspace }}/build/native/lib/libphotonx_native.so
        run: pytest -q

  native-smoke:
    name: native-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Build native C++ spatial backend
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 2
      - name: Locate native library
        run: python -c "import os,platform; from pathlib import Path; names={'Windows':'photonx_native.dll','Darwin':'libphotonx_native.dylib','Linux':'libphotonx_native.so'}; matches=list(Path('build/native').rglob(names[platform.system()])); assert matches, 'native library not found'; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('PHOTONX_NATIVE_LIBRARY='+str(matches[0].resolve())+chr(10))"
      - name: Verify native library load
        run: python -c "from photonx_eda_pcb.spatial_connectivity.native_backend import native_available; assert native_available()"
      - name: Run native parity and persistent-index smoke tests
        run: pytest -q tests/test_cpp_spatial_backend.py
