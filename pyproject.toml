[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonx-eda-pcb"
version = "0.2.0"
description = "Evidence-driven PCB manufacturing-data reconstruction toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2",
  "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
photonx = "photonx_eda_pcb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
