[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonx-eda-pcb"
version = "0.1.0"
description = "PCB reverse-engineering MVP: Gerber/Excellon to connectivity, GUI and KiCad"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "networkx>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
photonx = "photonx_eda_pcb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
