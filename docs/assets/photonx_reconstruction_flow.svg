<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PHOTONX End-to-End Reconstruction Flow</title>
<desc id="desc">Manufacturing data moves through discovery, strict parsing, geometry, connectivity, physical nets, hypotheses, semantic evidence, review, export, validation, regression and release readiness.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/>
  </marker>
  <style>
    .bg{fill:#ffffff}.title{font:700 36px Inter,Segoe UI,Arial,sans-serif;fill:#111827}.sub{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#4b5563}
    .lane{fill:#f8fafc;stroke:#d1d5db;stroke-width:2}.laneTitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#374151;letter-spacing:.4px}
    .box{stroke-width:2;rx:18;ry:18}.t{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#111827}.s{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#4b5563}
    .a{stroke:#5b6472;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8b5cf6;stroke-width:3;fill:none;stroke-dasharray:9 8;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="bg" width="1600" height="900"/>
<text x="80" y="70" class="title">PHOTONX — Evidence-Driven PCB Reconstruction</text>
<text x="80" y="105" class="sub">Physical evidence first. Inference is bounded. Unknown remains unknown.</text>

<rect x="60" y="150" width="1480" height="180" class="lane"/>
<text x="85" y="182" class="laneTitle">1 · SOURCE → PHYSICAL RECONSTRUCTION</text>

<rect x="90" y="215" width="205" height="82" class="box" fill="#e0f2fe" stroke="#0284c7"/>
<text x="192" y="246" text-anchor="middle" class="t">Manufacturing Files</text>
<text x="192" y="270" text-anchor="middle" class="s">Gerber · Excellon · refs</text>

<rect x="345" y="215" width="185" height="82" class="box" fill="#ecfeff" stroke="#0891b2"/>
<text x="438" y="246" text-anchor="middle" class="t">Discovery</text>
<text x="438" y="270" text-anchor="middle" class="s">classify files / layers</text>

<rect x="580" y="215" width="205" height="82" class="box" fill="#eef2ff" stroke="#4f46e5"/>
<text x="682" y="246" text-anchor="middle" class="t">Strict Parsing</text>
<text x="682" y="270" text-anchor="middle" class="s">supported syntax only</text>

<rect x="835" y="215" width="205" height="82" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="938" y="246" text-anchor="middle" class="t">Normalized Geometry</text>
<text x="938" y="270" text-anchor="middle" class="s">tracks · pads · drills · slots</text>

<rect x="1090" y="215" width="205" height="82" class="box" fill="#fdf4ff" stroke="#c026d3"/>
<text x="1192" y="246" text-anchor="middle" class="t">Connectivity</text>
<text x="1192" y="270" text-anchor="middle" class="s">exact contact graph</text>

<rect x="1340" y="215" width="160" height="82" class="box" fill="#fff1f2" stroke="#e11d48"/>
<text x="1420" y="246" text-anchor="middle" class="t">Physical Nets</text>
<text x="1420" y="270" text-anchor="middle" class="s">deterministic groups</text>

<path d="M295 256 H345" class="a"/><path d="M530 256 H580" class="a"/><path d="M785 256 H835" class="a"/><path d="M1040 256 H1090" class="a"/><path d="M1295 256 H1340" class="a"/>

<rect x="60" y="365" width="1480" height="200" class="lane"/>
<text x="85" y="397" class="laneTitle">2 · PHYSICAL EVIDENCE → ENGINEERING HYPOTHESES</text>

<rect x="180" y="440" width="250" height="88" class="box" fill="#ecfdf5" stroke="#059669"/>
<text x="305" y="472" text-anchor="middle" class="t">Component Hypotheses</text>
<text x="305" y="498" text-anchor="middle" class="s">grouping · confidence · evidence</text>

<rect x="530" y="440" width="250" height="88" class="box" fill="#f0fdf4" stroke="#16a34a"/>
<text x="655" y="472" text-anchor="middle" class="t">Semantic Evidence</text>
<text x="655" y="498" text-anchor="middle" class="s">roles · buses · clocks · power</text>

<rect x="880" y="440" width="250" height="88" class="box" fill="#fefce8" stroke="#ca8a04"/>
<text x="1005" y="472" text-anchor="middle" class="t">Schematic / Blocks</text>
<text x="1005" y="498" text-anchor="middle" class="s">review-oriented reconstruction</text>

<rect x="1230" y="440" width="210" height="88" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="1335" y="472" text-anchor="middle" class="t">Review / Editing</text>
<text x="1335" y="498" text-anchor="middle" class="s">human-in-the-loop</text>

<path d="M305 440 C305 390 1420 390 1420 297" class="dash"/>
<path d="M430 484 H530" class="a"/><path d="M780 484 H880" class="a"/><path d="M1130 484 H1230" class="a"/>

<rect x="60" y="600" width="1480" height="235" class="lane"/>
<text x="85" y="632" class="laneTitle">3 · VALIDATION, EXPORT, REGRESSION, READINESS</text>

<rect x="120" y="690" width="240" height="88" class="box" fill="#eff6ff" stroke="#2563eb"/>
<text x="240" y="722" text-anchor="middle" class="t">Engineering Checks</text>
<text x="240" y="748" text-anchor="middle" class="s">DRC · ERC · geometry · risk</text>

<rect x="455" y="690" width="240" height="88" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="575" y="722" text-anchor="middle" class="t">Validation / Provenance</text>
<text x="575" y="748" text-anchor="middle" class="s">errors · warnings · evidence</text>

<rect x="790" y="690" width="220" height="88" class="box" fill="#f0fdf4" stroke="#16a34a"/>
<text x="900" y="722" text-anchor="middle" class="t">Exports</text>
<text x="900" y="748" text-anchor="middle" class="s">JSON · reports · KiCad</text>

<rect x="1105" y="690" width="220" height="88" class="box" fill="#fefce8" stroke="#ca8a04"/>
<text x="1215" y="722" text-anchor="middle" class="t">Regression / Round-Trip</text>
<text x="1215" y="748" text-anchor="middle" class="s">CI · replay · fidelity</text>

<rect x="1390" y="690" width="120" height="88" class="box" fill="#fff1f2" stroke="#e11d48"/>
<text x="1450" y="718" text-anchor="middle" class="t">Release</text>
<text x="1450" y="742" text-anchor="middle" class="s">readiness</text>
<text x="1450" y="760" text-anchor="middle" class="s">profiles</text>

<path d="M938 297 V650 H240 V690" class="dash"/>
<path d="M1335 528 V650 H900 V690" class="dash"/>
<path d="M360 734 H455" class="a"/><path d="M695 734 H790" class="a"/><path d="M1010 734 H1105" class="a"/><path d="M1325 734 H1390" class="a"/>

<text x="80" y="872" class="sub">Solid arrows = primary flow · Dashed arrows = evidence / validation dependency</text>
</svg>