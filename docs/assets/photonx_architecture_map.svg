<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">PHOTONX Architecture Map</title>
<desc id="desc">Layered PHOTONX architecture from source adapters and parsers through physical modeling, inference, validation, review, export and release governance.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker>
  <style>
    .title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#111827}.sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
    .band{stroke-width:2;rx:22;ry:22}.bandtitle{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#111827}
    .box{stroke-width:2;rx:14;ry:14}.t{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#111827}.s{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
    .a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.cross{stroke:#8b5cf6;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="920" fill="#fff"/>
<text x="70" y="60" class="title">PHOTONX Architecture Map</text>
<text x="70" y="94" class="sub">Evidence flows upward. Confidence and provenance remain visible across every layer.</text>

<rect x="60" y="130" width="1480" height="130" class="band" fill="#f0f9ff" stroke="#7dd3fc"/>
<text x="85" y="164" class="bandtitle">INPUT & PARSING</text>
<rect x="110" y="185" width="250" height="54" class="box" fill="#e0f2fe" stroke="#0284c7"/>
<text x="235" y="218" text-anchor="middle" class="t">Source Adapters / Discovery</text>
<rect x="430" y="185" width="250" height="54" class="box" fill="#ecfeff" stroke="#0891b2"/>
<text x="555" y="218" text-anchor="middle" class="t">Gerber / Excellon Parsers</text>
<rect x="750" y="185" width="250" height="54" class="box" fill="#eef2ff" stroke="#4f46e5"/>
<text x="875" y="218" text-anchor="middle" class="t">Diagnostics / Capabilities</text>
<rect x="1070" y="185" width="350" height="54" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="1245" y="218" text-anchor="middle" class="t">Provenance / Evidence Capture</text>

<path d="M360 212 H430" class="a"/><path d="M680 212 H750" class="a"/><path d="M1000 212 H1070" class="a"/>

<rect x="60" y="295" width="1480" height="155" class="band" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="85" y="330" class="bandtitle">PHYSICAL MODEL</text>
<rect x="120" y="352" width="240" height="62" class="box" fill="#f1f5f9" stroke="#64748b"/>
<text x="240" y="378" text-anchor="middle" class="t">Geometry Kernel</text>
<text x="240" y="398" text-anchor="middle" class="s">tracks · pads · outlines</text>
<rect x="430" y="352" width="240" height="62" class="box" fill="#f1f5f9" stroke="#64748b"/>
<text x="550" y="378" text-anchor="middle" class="t">Spatial Indexing</text>
<text x="550" y="398" text-anchor="middle" class="s">candidate reduction</text>
<rect x="740" y="352" width="240" height="62" class="box" fill="#f1f5f9" stroke="#64748b"/>
<text x="860" y="378" text-anchor="middle" class="t">Connectivity Graph</text>
<text x="860" y="398" text-anchor="middle" class="s">exact copper contact</text>
<rect x="1050" y="352" width="240" height="62" class="box" fill="#f1f5f9" stroke="#64748b"/>
<text x="1170" y="378" text-anchor="middle" class="t">Physical Nets</text>
<text x="1170" y="398" text-anchor="middle" class="s">deterministic groups</text>
<rect x="1360" y="352" width="120" height="62" class="box" fill="#f1f5f9" stroke="#64748b"/>
<text x="1420" y="378" text-anchor="middle" class="t">Stackup</text>
<text x="1420" y="398" text-anchor="middle" class="s">via span</text>
<path d="M360 383 H430" class="a"/><path d="M670 383 H740" class="a"/><path d="M980 383 H1050" class="a"/><path d="M1290 383 H1360" class="a"/>

<rect x="60" y="485" width="1480" height="155" class="band" fill="#f0fdf4" stroke="#86efac"/>
<text x="85" y="520" class="bandtitle">INFERENCE & ENGINEERING ANALYSIS</text>
<rect x="110" y="542" width="250" height="62" class="box" fill="#ecfdf5" stroke="#059669"/>
<text x="235" y="568" text-anchor="middle" class="t">Component / Footprint</text>
<text x="235" y="588" text-anchor="middle" class="s">hypotheses + confidence</text>
<rect x="430" y="542" width="250" height="62" class="box" fill="#ecfdf5" stroke="#059669"/>
<text x="555" y="568" text-anchor="middle" class="t">Semantic Inference</text>
<text x="555" y="588" text-anchor="middle" class="s">roles · buses · protocols</text>
<rect x="750" y="542" width="250" height="62" class="box" fill="#fefce8" stroke="#ca8a04"/>
<text x="875" y="568" text-anchor="middle" class="t">DRC / ERC / Risk</text>
<text x="875" y="588" text-anchor="middle" class="s">geometry · electrical review</text>
<rect x="1070" y="542" width="350" height="62" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="1245" y="568" text-anchor="middle" class="t">Schematic Graph / Functional Blocks</text>
<text x="1245" y="588" text-anchor="middle" class="s">review-oriented reconstruction</text>
<path d="M360 573 H430" class="a"/><path d="M680 573 H750" class="a"/><path d="M1000 573 H1070" class="a"/>

<rect x="60" y="675" width="1480" height="165" class="band" fill="#fff7ed" stroke="#fdba74"/>
<text x="85" y="710" class="bandtitle">REVIEW, EXPORT & GOVERNANCE</text>
<rect x="105" y="734" width="245" height="64" class="box" fill="#fff7ed" stroke="#ea580c"/>
<text x="228" y="760" text-anchor="middle" class="t">Human Review Workflow</text>
<text x="228" y="780" text-anchor="middle" class="s">accept · reject · defer</text>
<rect x="410" y="734" width="245" height="64" class="box" fill="#fef3c7" stroke="#d97706"/>
<text x="533" y="760" text-anchor="middle" class="t">Evidence Database</text>
<text x="533" y="780" text-anchor="middle" class="s">traceability · replay</text>
<rect x="715" y="734" width="245" height="64" class="box" fill="#eff6ff" stroke="#2563eb"/>
<text x="838" y="760" text-anchor="middle" class="t">Exporters / GUI</text>
<text x="838" y="780" text-anchor="middle" class="s">JSON · KiCad · reports</text>
<rect x="1020" y="734" width="245" height="64" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="1143" y="760" text-anchor="middle" class="t">Regression / Round-Trip</text>
<text x="1143" y="780" text-anchor="middle" class="s">CI · baselines · fidelity</text>
<rect x="1325" y="734" width="150" height="64" class="box" fill="#ecfdf5" stroke="#059669"/>
<text x="1400" y="760" text-anchor="middle" class="t">Release</text>
<text x="1400" y="780" text-anchor="middle" class="s">readiness</text>
<path d="M350 766 H410" class="a"/><path d="M655 766 H715" class="a"/><path d="M960 766 H1020" class="a"/><path d="M1265 766 H1325" class="a"/>

<path d="M1245 239 V300 H240 V352" class="cross"/>
<path d="M1170 414 V490 H235 V542" class="cross"/>
<path d="M875 604 V680 H228 V734" class="cross"/>
<path d="M1245 604 V680 H838 V734" class="cross"/>
<text x="70" y="885" class="sub">Dashed paths show cross-cutting provenance/review dependencies. Higher-level inference never overwrites lower-level source evidence.</text>
